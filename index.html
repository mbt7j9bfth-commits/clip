<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;height:100%;background:#0b0b0b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center}
  main{width:min(94vw,820px);text-align:center;padding:16px 0}
  video{display:block;width:100%;max-height:70vh;max-height:70svh;background:#000;border-radius:12px}
  h1{margin:20px 0 0;font-size:clamp(36px,11vw,88px);line-height:1.05;font-weight:900;letter-spacing:.02em;color:#ffde00;text-shadow:0 4px 0 #c40000,0 0 24px rgba(255,0,0,.6)}
  h1[hidden]{display:none}
  .pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both, wob 1.2s ease-in-out .5s infinite}
  @keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes wob{50%{transform:scale(1.06) rotate(-2deg)}}
</style>
</head>
<body>
<main>
  <video id="v" src="clip.mp4" controls playsinline webkit-playsinline preload="metadata"></video>
  <h1 id="msg" hidden>YOU GOT RICKED!</h1>
</main>
<script>
  var v=document.getElementById('v'),m=document.getElementById('msg');
  function show(){if(m.hidden){m.hidden=false;m.className='pop';}}
  v.addEventListener('play',show);v.addEventListener('playing',show);
  v.muted=false;v.volume=1;
</script>
</body>
</html>
