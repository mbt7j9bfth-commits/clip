<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treasure</title>
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 35%,#2a1a4a 0%,#120a24 55%,#07040f 100%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px 56px;overflow-x:hidden}
  main{width:min(94vw,720px);text-align:center;position:relative}
  h2{margin:0 0 6px;font-size:clamp(26px,7vw,44px);font-weight:900;color:#ffd84a;text-shadow:0 3px 0 #8a5a00,0 0 18px rgba(255,200,60,.45)}
  .sub{margin:0 0 18px;color:#cbb8ff;font-size:16px}
  #chestWrap{position:relative;width:min(78vw,320px);margin:0 auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #chestWrap svg{width:100%;height:auto;display:block;overflow:visible}
  #lid{transform-origin:50% 92%;transform-box:fill-box;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
  .open #lid{transform:rotateX(0) translateY(-34px) rotate(-18deg)}
  #glow{opacity:0;transition:opacity .5s}
  .open #glow{opacity:1}
  .idle #chestWrap{animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px) rotate(-1.5deg)}}
  .shake #chestWrap{animation:shake .35s linear 2}
  @keyframes shake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  #openBtn{margin-top:22px;font:800 20px/1 system-ui,-apple-system,sans-serif;padding:16px 30px;min-height:52px;border:0;border-radius:999px;color:#3a2200;background:linear-gradient(#ffe58a,#f5b31c);box-shadow:0 5px 0 #a86b00,0 0 24px rgba(255,200,60,.5);cursor:pointer}
  #openBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #a86b00}
  #stage{display:none}
  .revealed #intro{display:none}
  .revealed #stage{display:block}
  video{display:block;width:100%;max-height:62vh;max-height:62svh;background:#000;border-radius:12px;box-shadow:0 0 40px rgba(255,210,80,.35)}
  h1{margin:18px 0 0;font-size:clamp(36px,11vw,88px);line-height:1.05;font-weight:900;color:#ffde00;text-shadow:0 4px 0 #c40000,0 0 24px rgba(255,0,0,.6);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both,wob 1.2s ease-in-out .5s infinite}
  @keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes wob{50%{transform:scale(1.06) rotate(-2deg)}}
  .coin{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c0,#ffcc2e 45%,#b97a00);pointer-events:none;animation:fly 1.1s ease-out forwards}
  @keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
  #err{display:none;font-size:13px;color:#aaa;margin-top:10px}
  footer{position:fixed;left:0;right:0;bottom:0;padding:12px;text-align:center;font-size:14px;color:#cbb8ff;opacity:.85;letter-spacing:.02em}
  @media (prefers-reduced-motion:reduce){.idle #chestWrap,h1{animation:none}}
</style>
</head>
<body class="idle">
<main>
  <section id="intro">
    <h2>You found a treasure!</h2>
    <p class="sub">Tap to see what's inside</p>
    <div id="chestWrap" role="button" aria-label="Open the treasure">
      <svg viewBox="0 0 200 170" aria-hidden="true">
        <g id="glow"><ellipse cx="100" cy="78" rx="80" ry="36" fill="#ffe27a" opacity=".55"/><ellipse cx="100" cy="80" rx="50" ry="20" fill="#fff6c8"/></g>
        <!-- base -->
        <rect x="22" y="80" width="156" height="80" rx="10" fill="#8b4a1c"/>
        <rect x="22" y="80" width="156" height="14" fill="#6e3812"/>
        <rect x="22" y="108" width="156" height="6" fill="#6e3812"/>
        <rect x="22" y="132" width="156" height="6" fill="#6e3812"/>
        <rect x="36" y="80" width="14" height="80" fill="#e0a52a"/>
        <rect x="150" y="80" width="14" height="80" fill="#e0a52a"/>
        <rect x="22" y="152" width="156" height="8" rx="4" fill="#e0a52a"/>
        <rect x="88" y="86" width="24" height="30" rx="4" fill="#ffd04a" stroke="#a86b00" stroke-width="2"/>
        <circle cx="100" cy="98" r="4" fill="#5a3300"/><rect x="98.5" y="99" width="3" height="9" fill="#5a3300"/>
        <!-- lid -->
        <g id="lid">
          <path d="M22 80 V52 Q22 18 100 18 Q178 18 178 52 V80 Z" fill="#9c5622"/>
          <path d="M22 80 V52 Q22 18 100 18 Q178 18 178 52 V80" fill="none" stroke="#6e3812" stroke-width="3"/>
          <path d="M36 80 V44 Q38 26 50 23 V80 Z" fill="#e0a52a"/>
          <path d="M150 80 V23 Q162 26 164 44 V80 Z" fill="#e0a52a"/>
          <rect x="22" y="74" width="156" height="8" rx="3" fill="#e0a52a"/>
          <rect x="90" y="64" width="20" height="18" rx="3" fill="#ffd04a" stroke="#a86b00" stroke-width="2"/>
        </g>
      </svg>
    </div>
    <button id="openBtn" type="button">Open the treasure</button>
  </section>
  <section id="stage">
    <video id="v" controls playsinline webkit-playsinline preload="auto">
      <source src="ssstik.io_1795764736744.mp4" type="video/mp4">
      <source src="https://cdn.jsdelivr.net/gh/mbt7j9bfth-commits/clip@main/ssstik.io_1795764736744.mp4" type="video/mp4">
    </video>
    <p id="err"></p>
    <h1>YOU GOT RICKED!</h1>
  </section>
</main>
<footer>made by Prince</footer>
<script>
{
  const body=document.body, v=document.getElementById('v'), wrap=document.getElementById('chestWrap');
  let opened=false;
  function coins(){
    const r=wrap.getBoundingClientRect(), main=document.querySelector('main').getBoundingClientRect();
    for(let i=0;i<14;i++){
      const c=document.createElement('span');c.className='coin';
      c.style.left=(r.left-main.left+r.width/2-8)+'px';c.style.top=(r.top-main.top+r.height*0.45)+'px';
      c.style.setProperty('--x',(Math.random()*240-120)+'px');c.style.setProperty('--y',(-80-Math.random()*140)+'px');
      document.querySelector('main').appendChild(c);setTimeout(()=>c.remove(),1200);
    }
  }
  function openIt(){
    if(opened)return;opened=true;
    body.classList.remove('idle');
    // Start playback inside the tap so phones allow sound.
    v.muted=false;v.volume=1;
    let revealed=false;
    const p=v.play();
    if(p&&p.then)p.then(()=>{if(!revealed){v.pause();try{v.currentTime=0}catch(e){}}}).catch(()=>{});
    body.classList.add('shake');
    setTimeout(()=>{body.classList.remove('shake');body.classList.add('open');coins();},700);
    setTimeout(()=>{revealed=true;body.classList.add('revealed');const q=v.play();if(q&&q.catch)q.catch(()=>{});},1600);
  }
  document.getElementById('openBtn').addEventListener('click',openIt);
  wrap.addEventListener('click',openIt);
  const srcs=v.getElementsByTagName('source');
  srcs[srcs.length-1].addEventListener('error',()=>{const e=document.getElementById('err');e.style.display='block';e.textContent='Video could not load. Try opening this link in Safari or Chrome.';});
}
</script>
</body>
</html>
